name: privateinhomecare
region: nyc

services:
  - name: web
    github:
      repo: bocsitcourier/privateinhomecare
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: node dist/index.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 5000
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "5000"
        scope: RUN_TIME
      - key: APP_URL
        value: https://privateinhomecaregiver.com
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: VITE_RECAPTCHA_SITE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: RECAPTCHA_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FROM_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: HR_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_PLACES_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: YOUTUBE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PHI_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_REGION
        value: nyc3
        scope: RUN_TIME
      - key: ENABLE_GEO_BLOCKING
        value: "true"
        scope: RUN_TIME
      - key: TRUSTED_PROXY_HEADER
        value: "1"
        scope: RUN_TIME

# Canonical nginx config for privateinhomecaregiver.com
# IMPORTANT: proxy_pass must use 127.0.0.1, NOT localhost.
# On Ubuntu 22.04+ "localhost" resolves to IPv6 [::1] but Node.js
# only listens on IPv4 0.0.0.0:5000, causing 502 errors.

server {
    server_name privateinhomecaregiver.com www.privateinhomecaregiver.com;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml image/svg+xml
               application/manifest+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite-built JS/CSS — hashed filenames, cache 1 year
    location /assets/ {
        alias /var/www/html/privateinhomecare/dist/public/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Root-level static files (favicon, manifest, robots.txt, PWA)
    location ~* ^/(favicon|android-chrome|apple-touch-icon|site\.webmanifest|manifest\.json|robots\.txt|sw\.js|pwa-icon) {
        root /var/www/html/privateinhomecare/dist/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Article/facility images — served from disk, cache 30 days
    location /attached_assets/ {
        alias /var/www/html/privateinhomecare/attached_assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # User uploads (facility photos from Google Places)
    location /uploads/ {
        alias /var/www/html/privateinhomecare/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Videos
    location /videos/ {
        alias /var/www/html/privateinhomecare/public/videos/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Thumbnails
    location /thumbnails/ {
        alias /var/www/html/privateinhomecare/public/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Location photos
    location /location-photos/ {
        alias /var/www/html/privateinhomecare/public/location-photos/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # PDF brochures
    location /brochures/ {
        alias /var/www/html/privateinhomecare/dist/public/brochures/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Everything else → Node.js
    # MUST use 127.0.0.1 not localhost (IPv6 vs IPv4 issue on Ubuntu 22.04+)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/privateinhomecaregiver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/privateinhomecaregiver.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.privateinhomecaregiver.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = privateinhomecaregiver.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name privateinhomecaregiver.com www.privateinhomecaregiver.com;
    return 404;
}

# PHASE 1 — HTTP-only nginx config used BEFORE SSL certificate issuance.
# After running certbot, this file is replaced by privateinhomecaregiver.conf.
#
# IMPORTANT: proxy_pass must use 127.0.0.1, NOT localhost.
# On Ubuntu 22.04+ "localhost" resolves to IPv6 [::1] but Node.js
# only listens on IPv4 0.0.0.0:5000, causing 502 errors.

server {
    listen 80;
    server_name privateinhomecaregiver.com www.privateinhomecaregiver.com;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml image/svg+xml
               application/manifest+json;

    # Vite-built JS/CSS — hashed filenames, cache 1 year
    location /assets/ {
        alias /var/www/html/privateinhomecare/dist/public/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Article/facility images
    location /attached_assets/ {
        alias /var/www/html/privateinhomecare/attached_assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # User uploads
    location /uploads/ {
        alias /var/www/html/privateinhomecare/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Videos / thumbnails / location photos / brochures
    location /videos/ {
        alias /var/www/html/privateinhomecare/public/videos/;
        expires 7d; access_log off;
    }
    location /thumbnails/ {
        alias /var/www/html/privateinhomecare/public/thumbnails/;
        expires 7d; access_log off;
    }
    location /location-photos/ {
        alias /var/www/html/privateinhomecare/public/location-photos/;
        expires 7d; access_log off;
    }
    location /brochures/ {
        alias /var/www/html/privateinhomecare/dist/public/brochures/;
        expires 7d; access_log off;
    }

    # Everything else → Node.js
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

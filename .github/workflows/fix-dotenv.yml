name: Install dotenv and Restart App

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install dotenv on server and restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/html/privateinhomecare

          echo "=== node_modules/dotenv before ==="
          ls node_modules/dotenv 2>&1 | head -3 || echo "missing"

          echo "=== Installing dotenv (without modifying package.json) ==="
          npm install dotenv@17 --no-save --no-audit --no-fund 2>&1 | tail -5

          echo "=== node_modules/dotenv after ==="
          ls node_modules/dotenv/package.json
          node -e "console.log(require('dotenv/package.json').version)"

          echo "=== Hard restart PM2 ==="
          pm2 kill || true
          sleep 2
          pm2 start ecosystem.config.cjs
          sleep 6
          pm2 save
          pm2 list

          echo "=== Listening on 5000? ==="
          ss -lntp | grep :5000 || echo "Not listening"

          echo "=== Health checks ==="
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/articles)
            echo "  /api/articles: $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 3
          done

          echo "=== Image smoke test ==="
          for path in \
            "/uploads/" \
            "/attached_assets/"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000$path")
            echo "  $path -> $CODE"
          done

          # Test actual files
          FIRST_IMG=$(ls /srv/privateinhomecare/media/attached_assets/stock_images/ 2>/dev/null | head -1 || true)
          if [ -n "$FIRST_IMG" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000/attached_assets/stock_images/$FIRST_IMG")
            echo "  /attached_assets/stock_images/$FIRST_IMG -> $CODE"
          fi
          FIRST_FAC=$(ls /srv/privateinhomecare/media/uploads/facility-photos/ 2>/dev/null | head -1 || true)
          if [ -n "$FIRST_FAC" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000/uploads/facility-photos/$FIRST_FAC")
            echo "  /uploads/facility-photos/$FIRST_FAC -> $CODE"
          fi

          echo "=== Last 5 error log lines ==="
          tail -5 /root/.pm2/logs/privateinhomecare-error-0.log || true
          REMOTE

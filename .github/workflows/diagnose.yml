name: Diagnose Production

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H 161.35.139.170 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect recovery droplet (key auth)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o BatchMode=yes root@161.35.139.170 'bash -s' <<'REMOTE'
          set +e
          echo "=== Disable fail2ban + open firewall ==="
          systemctl stop fail2ban 2>&1 | tail -3
          systemctl disable fail2ban 2>&1 | tail -3
          fail2ban-client unban --all 2>&1 | head -3
          ufw status 2>&1 | head -5
          echo ""
          echo "=== Hostname ==="; hostname
          echo ""
          echo "=== Postgres ==="
          pg_lsclusters 2>&1
          systemctl start postgresql 2>&1
          sleep 2
          echo ""
          echo "=== Databases ==="
          sudo -u postgres psql -l 2>&1 | head -30
          echo ""
          echo "=== Counts per DB ==="
          for db in $(sudo -u postgres psql -At -c "SELECT datname FROM pg_database WHERE datname NOT IN ('template0','template1','postgres');" 2>/dev/null); do
            ART=$(sudo -u postgres psql -At -d "$db" -c "SELECT count(*) FROM articles;" 2>/dev/null)
            FAQ=$(sudo -u postgres psql -At -d "$db" -c "SELECT count(*) FROM article_faqs;" 2>/dev/null)
            FAC=$(sudo -u postgres psql -At -d "$db" -c "SELECT count(*) FROM facilities;" 2>/dev/null)
            FFAQ=$(sudo -u postgres psql -At -d "$db" -c "SELECT count(*) FROM facility_faqs;" 2>/dev/null)
            CTP=$(sudo -u postgres psql -At -d "$db" -c "SELECT count(*) FROM care_type_pages;" 2>/dev/null)
            echo "DB=$db articles=${ART:-?} article_faqs=${FAQ:-?} facilities=${FAC:-?} facility_faqs=${FFAQ:-?} care_type_pages=${CTP:-?}"
          done
          echo ""
          echo "=== /var/www ==="
          ls /var/www/ 2>/dev/null
          ls /var/www/html/ 2>/dev/null | head -20
          echo ""
          echo "=== Env files ==="
          find /var/www /root /opt -maxdepth 4 -name '.env*' 2>/dev/null | head -10
          echo ""
          echo "=== Media ==="
          du -sh /srv/* /var/www/html/*/uploads /var/www/html/*/attached_assets /var/www/html/*/media 2>/dev/null
          REMOTE

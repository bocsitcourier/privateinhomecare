name: Diagnose Production

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect SQL dump
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          DUMP=/tmp/replit_db_full.sql
          echo "=== File info ==="
          ls -lah $DUMP
          file $DUMP
          echo ""
          echo "=== Tables present ==="
          grep -E "^(CREATE TABLE|COPY public\.)" $DUMP | head -60
          echo ""
          echo "=== Rough row counts (lines between COPY and \\.) per table ==="
          awk '/^COPY public\.([a-z_]+)/{tbl=$2; gsub(/^public\./,"",tbl); inblock=1; cnt=0; next} /^\\\.$/{if(inblock){print cnt, tbl; inblock=0}} inblock{cnt++}' $DUMP | sort -rn | head -30
          REMOTE

name: Diagnose Production

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H 174.138.88.127 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect dump file
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o BatchMode=yes root@174.138.88.127 bash <<'EOF'
          set +e
          echo "=== Dump file size & date ==="
          ls -la /tmp/replit_db_full.sql /root/*.sql /root/*.dump /backups/ /var/backups/ 2>&1
          echo ""
          echo "=== All sql/dump on disk ==="
          find / -xdev \( -name '*.sql' -o -name '*.dump' -o -name '*.dump.gz' -o -name '*.sql.gz' -o -name '*.tar.gz' \) -size +50k 2>/dev/null | head -30
          echo ""
          echo "=== Header of replit_db_full.sql ==="
          head -50 /tmp/replit_db_full.sql 2>&1
          echo ""
          echo "=== Article count in dump ==="
          grep -c "^INSERT INTO public.articles" /tmp/replit_db_full.sql 2>&1
          grep -c "^INSERT INTO articles" /tmp/replit_db_full.sql 2>&1
          grep -c "COPY public.articles\|COPY articles" /tmp/replit_db_full.sql 2>&1
          echo ""
          echo "=== Looking at COPY block (if pg_dump format) ==="
          awk '/^COPY public\.articles/{f=1;c=0;next} f && /^\\\.$/{print "Articles in COPY:",c;f=0} f{c++}' /tmp/replit_db_full.sql 2>&1
          echo ""
          echo "=== Tables in dump ==="
          grep -oE "CREATE TABLE (public\.)?[a-zA-Z_]+" /tmp/replit_db_full.sql 2>&1 | sort -u | head -50
          echo ""
          echo "=== Compare local DB to dump for key tables ==="
          for t in articles article_faqs facilities facility_faqs care_type_pages locations location_pages caregivers jobs media; do
            LOCAL=$(sudo -u postgres psql -At -d privateinhomecare -c "SELECT count(*) FROM $t;" 2>/dev/null)
            DUMP=$(awk "/^COPY public\\.${t} /,/^\\\\\\.\$/" /tmp/replit_db_full.sql 2>/dev/null | wc -l)
            DUMP=$((DUMP - 2))
            echo "  $t: local=$LOCAL dump=$DUMP"
          done
          EOF

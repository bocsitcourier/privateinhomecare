name: Diagnose Production

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Look for any old backups or databases
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          echo "=== Look for ANY .sql, .dump, .backup, .tar.gz files anywhere ==="
          find / -type f \( -name "*.sql" -o -name "*.dump" -o -name "*.backup" -o -name "*backup*.tar*" -o -name "*-dump*" \) 2>/dev/null | grep -v "/proc/\|/sys/\|/snap/\|node_modules" | head -40
          echo ""
          echo "=== /srv contents ==="
          ls -lah /srv/ 2>/dev/null
          ls -lah /srv/privateinhomecare/ 2>/dev/null
          ls -lah /srv/privateinhomecare/backups/ 2>/dev/null
          echo ""
          echo "=== /root contents ==="
          ls -lah /root/ 2>/dev/null
          echo ""
          echo "=== Postgres databases ==="
          sudo -u postgres psql -l 2>/dev/null
          echo ""
          echo "=== Article count in current DB ==="
          sudo -u postgres psql -d privateinhomecare -c "SELECT COUNT(*), MIN(created_at), MAX(created_at) FROM articles;" 2>/dev/null
          echo ""
          echo "=== Postgres data dirs and any other DBs/files ==="
          ls -lah /var/lib/postgresql/ 2>/dev/null
          echo ""
          echo "=== /var/www contents (other sites?) ==="
          ls -lah /var/www/ 2>/dev/null
          ls -lah /var/www/html/ 2>/dev/null
          REMOTE

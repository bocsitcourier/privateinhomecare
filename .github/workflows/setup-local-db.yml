name: Setup Local PostgreSQL on Production Server

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'CFG'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 60
            TCPKeepAlive yes
            ConnectTimeout 30
          CFG

      - name: Validate required secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERROR: GitHub secret DB_PASSWORD is not set."
            echo "Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Add swap space (1GB nano needs it)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q "/swapfile" /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
            echo "Swap added"
          else
            echo "Swap already configured"
          fi
          free -m
          REMOTE

      - name: Apt update
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          REMOTE

      - name: Install PostgreSQL (minimal)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v psql >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends postgresql postgresql-client
          fi
          systemctl enable postgresql
          systemctl start postgresql
          sleep 5
          systemctl is-active postgresql
          psql --version
          REMOTE

      - name: Create DB and set password
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o SendEnv=DB_PASSWORD \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "DB_PASSWORD='${DB_PASSWORD}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERROR: DB_PASSWORD not received on remote"
            exit 1
          fi
          # Idempotent: only create if missing
          DB_EXISTS=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='privateinhomecare';" || echo "")
          if [ "$DB_EXISTS" != "1" ]; then
            sudo -u postgres psql -c "CREATE DATABASE privateinhomecare;"
          else
            echo "Database privateinhomecare already exists"
          fi
          # Always (re)set password from secret
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '${DB_PASSWORD//\'/\'\'}';" >/dev/null
          echo "DB and credentials configured"
          REMOTE

      - name: Restore dump (with validation)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "DB_PASSWORD='${DB_PASSWORD}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ ! -f /tmp/replit_db_full.sql ]; then
            echo "ERROR: /tmp/replit_db_full.sql not found on server. Upload it via scp first."
            exit 1
          fi
          ls -lh /tmp/replit_db_full.sql

          # Run psql with ON_ERROR_STOP and capture exit code (no pipe masking)
          set +e
          PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U postgres -d privateinhomecare \
            -v ON_ERROR_STOP=1 -f /tmp/replit_db_full.sql > /tmp/restore.log 2>&1
          RC=$?
          set -e

          tail -30 /tmp/restore.log
          if [ $RC -ne 0 ]; then
            echo "ERROR: psql restore failed with exit code $RC"
            exit $RC
          fi

          # Post-restore validation: required tables must exist with rows
          echo "=== Validation ==="
          ROWS=$(PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U postgres -d privateinhomecare -tAc \
            "SELECT count(*) FROM articles;")
          FAC=$(PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U postgres -d privateinhomecare -tAc \
            "SELECT count(*) FROM facilities;")
          TABLES=$(PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U postgres -d privateinhomecare -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Tables: $TABLES, Articles: $ROWS, Facilities: $FAC"
          if [ "$TABLES" -lt 30 ] || [ "$ROWS" -lt 1 ] || [ "$FAC" -lt 1 ]; then
            echo "ERROR: Restore validation failed (insufficient data)"
            exit 1
          fi
          echo "Restore validated successfully"
          REMOTE

      - name: Update .env (atomic, newline-safe) and restart
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "DB_PASSWORD='${DB_PASSWORD}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/html/privateinhomecare
          ENV_FILE=.env
          BACKUP=".env.bak.$(date +%s)"

          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" "$BACKUP"
          else
            touch "$ENV_FILE"
          fi

          # Ensure file ends with newline before appending
          [ -s "$ENV_FILE" ] && [ "$(tail -c1 "$ENV_FILE" | wc -l)" -eq 0 ] && printf '\n' >> "$ENV_FILE"

          # Atomic rewrite: drop existing DATABASE_URL line, add new one
          NEW_URL="postgresql://postgres:${DB_PASSWORD}@127.0.0.1:5432/privateinhomecare"
          TMP=$(mktemp)
          grep -v '^DATABASE_URL=' "$ENV_FILE" > "$TMP" || true
          printf 'DATABASE_URL=%s\n' "$NEW_URL" >> "$TMP"
          mv "$TMP" "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          cp "$ENV_FILE" /var/www/.env
          chmod 600 /var/www/.env

          # Verify the line is present and well-formed
          grep -q '^DATABASE_URL=postgresql://' "$ENV_FILE" || {
            echo "ERROR: DATABASE_URL not present after rewrite"
            cp "$BACKUP" "$ENV_FILE"
            exit 1
          }

          pm2 kill || true
          sleep 2
          pm2 start ecosystem.config.cjs
          sleep 5
          pm2 save
          pm2 logs privateinhomecare --lines 15 --nostream || true
          REMOTE
